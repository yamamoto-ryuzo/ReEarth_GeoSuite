[package]
name = "geosuite-hub"
version = "22.5.0"
edition = "2021"
build = "build.rs"
description = "GeoSuite dedicated local bridge hub (127.0.0.1:8514) — self-installing companion to the Re:Earth geo_suite plugin"
license = "MIT"

[[bin]]
name = "geosuite-hub"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
github-copilot-sdk = { version = "1.0.28", default-features = false }
opener = "0.7.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
sysinfo = "0.40.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39.1"

[build-dependencies]
winres = "0.1.12"
